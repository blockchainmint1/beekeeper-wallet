name: Security checks

# Runs on every push and pull request. Uses no secrets, so it is safe on forks.
# Never switch this to pull_request_target.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install (exact lockfile)
        run: bun install --frozen-lockfile
      - name: Type check
        run: bunx tsc --noEmit -p .
      - name: Unit tests (Tron verify, proxy guards, origins, wipe/KDF, WIF wrapping, cash-out)
        run: bunx vitest run
      - name: Dependency audit — shipped libraries (fail on critical)
        run: bun audit --prod --audit-level=critical
      - name: Dependency audit — everything incl. build tools (report only)
        run: bun audit --audit-level=high
        continue-on-error: true
