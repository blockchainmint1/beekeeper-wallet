name: Security checks

# Runs on every push and pull request. Uses no secrets (the repo is public).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install (exact lockfile)
        run: bun install --frozen-lockfile
      - name: Type check
        run: bunx tsc --noEmit -p .
      - name: Unit tests (Tron verify, proxy guards, origins, wipe/KDF, WIF wrapping, cash-out)
        run: bunx vitest run
      - name: Dependency audit — shipped libraries (fail on critical)
        run: bun audit --prod --audit-level=critical
      - name: Dependency audit — everything incl. build tools (report only)
        run: bun audit --audit-level=high
        continue-on-error: true
